name: GNARLY WEB — integrity and smoke
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked audio intelligence dependencies
        run: npm install --no-audit --no-fund
      - name: Verify JavaScript syntax
        run: |
          node --check app.js
          node --check lib/audio-engine.js
          node --check lib/performance-pads.js
          node --check lib/music-note-intelligence.js
          node --check lib/audio-midi-transcriber.js
          node --check ui/performance-panel.js
          node --check lib/visual-engine.js
          node --check lib/lrc.js
          node --check lib/catalog.js
          node --check lib/omnibox.js
          node --check lib/music-presets.js
          node --check lib/playback-source.js
          node --check lib/stem-mixer.js
          node --check lib/visual-selection.js
          node --check ui/music-panel.js
          node --check ui/display-panel.js
          node --check ui/display-panel.js
          node --check netlify/functions/omnibox.mjs
          node --check netlify/functions/catalog.mjs
          node --check src/worker.js
          node --check functions/api/catalog.js
          node --check functions/api/omnibox.js
          node --check functions/api/stems-ticket.js
      - name: Run unit tests
        run: npm test
      - name: Validate Cloudflare Pages build output
        run: |
          npm run build:pages
          test -s dist/index.html
          test -s dist/performance.css
          test -s dist/module-dock.css
          test -s dist/basic-pitch-worker.js
          test -s dist/models/basic-pitch/model.json
          test -s dist/models/basic-pitch/group1-shard1of1.bin
          test -s dist/_headers
          test ! -e dist/netlify
          test ! -e dist/functions
          test ! -e dist/tests
