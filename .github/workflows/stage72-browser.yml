name: GNARLY WEB Stage72 browser UI test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project test dependencies
        run: npm install --no-audit --no-fund
      - name: Validate JavaScript and unit tests
        run: |
          node --check app.js
          npm test
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/gnarly-web-test.log 2>&1 &
          echo $! > /tmp/gnarly-web-test.pid
      - name: Test mobile Stage72 UI
        run: |
          node tests/header-viewport.browser.mjs
          node tests/stage72-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gnarly-stage72-mobile
          path: stage72-ui-mobile.png
          if-no-files-found: ignore
