name: Read-only R2 media AAC decode diagnostic
on:
  pull_request:
    paths:
      - 'tests/live-cached-m4a-decode.mjs'
      - '.github/workflows/r2-media-decode-health.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decode-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure FFmpeg and FFprobe are available
        run: |
          command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
          command -v ffmpeg
      - name: Verify exact R2 object parses and decodes as audio
        env:
          GNARLY_VERIFY_VIDEO_ID: kb8UsWvW5Hw
          GNARLY_PROBE_URL: https://gnarly-web-pages.pages.dev
        run: node tests/live-cached-m4a-decode.mjs
      - name: Verify real GNARLY player plays the cached original
        env:
          GNARLY_VERIFY_VIDEO_ID: kb8UsWvW5Hw
          GNARLY_PROBE_URL: https://gnarly-web-pages.pages.dev
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          npm install --no-save playwright@1.56.1
          node tests/live-r2-native-player.browser.mjs
