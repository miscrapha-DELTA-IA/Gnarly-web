name: Playback performance regression
on:
  pull_request:
    paths: ['app.js', 'lib/**', 'functions/**', 'src/**', 'tests/playback*', '.github/workflows/playback-performance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-media:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test tools
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.56.1
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Exercise real native AAC playback with local edge and origin fixtures
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          SAMPLES: '20'
          REPORT_PATH: playback-performance.json
        run: node tests/playback-performance.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playback-performance
          path: playback-performance.json
          if-no-files-found: ignore
