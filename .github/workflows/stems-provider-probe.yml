name: GNARLY Stems provider identity probe
on:
  push:
    paths: ['.github/workflows/stems-provider-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check provider identity and availability without uploading audio
        run: |
          python3 - <<'PY'
          import json,urllib.request
          def get(url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'user-agent':'GNARLY-availability-probe/1.0'}), timeout=16) as r:
                      return json.load(r)
              except Exception as e:
                  print("CHECK UNAVAILABLE",url.split('/')[2],type(e).__name__)
                  return {}
          x=get('https://huggingface.co/api/spaces/D-r-e/audio-separator')
          rt=x.get('runtime') or {}
          print('community_space:',json.dumps({'sha':x.get('sha'),'sdk':x.get('sdk'),'stage':rt.get('stage'),'hardware':(rt.get('hardware') or {}).get('current')},ensure_ascii=False))
          y=get('https://nightcorelab.onrender.com/v1/stems/cloud')
          print('GNARLY backend:',json.dumps(y,ensure_ascii=False))
          c=get('https://d-r-e-audio-separator.hf.space/config')
          print('community_endpoint_names:',[item.get('api_name') for item in c.get('dependencies',[]) if item.get('api_name')])
          for dep in c.get('dependencies',[]):
              if dep.get('api_name')=='separate':
                  byid={item['id']:item for item in c.get('components',[])}
                  def summary(ids):
                      return [{'type':byid.get(i,{}).get('type'),'label':byid.get(i,{}).get('props',{}).get('label'),'value':str(byid.get(i,{}).get('props',{}).get('value',''))[:120]} for i in ids]
                  print('community_input_contract:',json.dumps(summary(dep.get('inputs',[])),ensure_ascii=False))
                  print('community_output_contract:',json.dumps(summary(dep.get('outputs',[])),ensure_ascii=False))
          for endpoint in ['/gradio_api/upload','/gradio_api/call/separate']:
              try:
                  req=urllib.request.Request('https://d-r-e-audio-separator.hf.space'+endpoint,method='OPTIONS',headers={
                      'Origin':'https://gnarlyweb.netlify.app',
                      'Access-Control-Request-Method':'POST',
                      'Access-Control-Request-Headers':'content-type'
                  })
                  with urllib.request.urlopen(req,timeout=15) as response:
                      print('community_CORS',endpoint,response.status,'origin',response.headers.get('Access-Control-Allow-Origin'),'methods',response.headers.get('Access-Control-Allow-Methods'))
              except Exception as e:
                  print('community_CORS_ERROR',endpoint,type(e).__name__)
          PY
